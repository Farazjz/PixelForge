[package]
name = "pixelforge-ai"
version = "1.0.0"
edition = "2021"
description = "PixelForge AI — pixel art studio"
authors = ["Farazjz"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
